name: kairo_step
description: "数字阶跃 KairosStep —— 把 737 条人生建议转化为可交互的行动系统。本地优先，不访问网络。"
publish_to: 'none'

version: 1.0.21+22

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 本地持久化：全平台支持（Android/iOS/macOS/Windows/Linux/Web）
  shared_preferences: ^2.5.3
  # 系统分享：全平台支持，Web 端自动降级
  share_plus: ^12.0.1
  url_launcher: ^6.3.3
  # 移动端主动探查通知
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^4.1.1
  timezone: ^0.10.1
  # 应用内音效（assets/sounds/ 本地合成音，不依赖网络）
  audioplayers: ^6.4.0
  onnxruntime: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 模拟器/真机 E2E 业务测试（docs/test/业务测试用例-E2E.md）
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # L0 实体层（关系化 Schema：docs/refactor/REFACTOR_DESIGN.md §4.9）
    - assets/data/entity/advice.json
    - assets/data/entity/advice_action.json
    - assets/data/entity/advice_detail.json
    - assets/data/entity/detail_source.json
    - assets/data/entity/advice_relation.json
    - assets/data/entity/advice_node.json
    # L1 维度结构
    - assets/data/dimensions/taxonomy.json
    - assets/data/dimensions/badge.json
    # L3 分维度标签
    - assets/data/facets/tag_dimension.json
    - assets/data/facets/tag.json
    - assets/data/facets/advice_tag.json
    # L4 展示信息（物化视图）
    - assets/data/views/display_info.json
    # L6 触发数据
    - assets/data/triggers/advice_trigger.json
    # L7 引擎配置
    - assets/data/config/engines.json
    - assets/data/config/gates.json
    - assets/data/config/probes.json
    - assets/data/config/onboarding.json
    # L2 交互样式 / L5 展示↔样式绑定
    - assets/data/styles/act_styles.json
    - assets/data/styles/display_bindings.json
    # 门禁谓词预编译（离线生成：GATE_TRAITS_UPDATE=1 flutter test test/build_gate_traits_test.dart）
    - assets/data/config/gate_traits.json
    # L8 语义能力（模型随包 + 版本绑定）
    - assets/data/config/models.json
    - assets/models/bge-small-zh-int8.onnx
    - assets/models/bge-vocab.txt
    # 保留资产
    - assets/data/node_packages.json
    - assets/data/pinyin.json
    # 应用内音效（tools/gen_sfx.dart 本地合成，勿手改二进制）
    - assets/sounds/check.wav
    - assets/sounds/success.wav
    - assets/sounds/stamp.wav
